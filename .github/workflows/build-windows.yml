name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Make test fixtures
        run: python tests/make_fixtures.py

      - name: Run tests (OCR tests skip if no Arabic OCR is present)
        run: python -m pytest -q tests --ignore=tests/test_gui.py

      - name: Check Windows OCR availability (informational)
        continue-on-error: true
        run: python -c "from waraq.core.ocr import WindowsOcrEngine as W; e=W(); print('available', e.available(), 'arabic', e.has_language('ara'))"

      - name: Build one-file exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name WaraqPDF
          --collect-all customtkinter --collect-all pypdfium2 --collect-submodules winrt
          --add-data "waraq/assets;waraq/assets"
          waraq_app.py

      - name: Smoke test the exe (CLI mode)
        run: |
          dist\WaraqPDF.exe info tests\_fixtures\english_50p.pdf > info.txt
          type info.txt
          findstr /C:"pages" info.txt || exit /b 1
          dist\WaraqPDF.exe totext tests\_fixtures\arabic_reportlab.pdf > ar.txt
          findstr /C:"PDF" ar.txt || exit /b 1
        shell: cmd

      - name: GUI start check (window must stay alive 20 s)
        shell: pwsh
        run: |
          $g = Start-Process -FilePath dist\WaraqPDF.exe -PassThru
          Start-Sleep -Seconds 20
          if ($g.HasExited) { throw "GUI exited early with code $($g.ExitCode)" }
          Stop-Process -Id $g.Id

      - uses: actions/upload-artifact@v4
        with:
          name: WaraqPDF-windows
          path: dist/WaraqPDF.exe

      - name: Windows Arabic OCR with the exe (informational)
        continue-on-error: true
        timeout-minutes: 30
        shell: pwsh
        run: |
          Get-WindowsCapability -Online -Name "Language.OCR*ar*" | Format-Table Name, State
          $sw = [Diagnostics.Stopwatch]::StartNew()
          Add-WindowsCapability -Online -Name "Language.OCR~~~ar-SA~0.0.1.0"
          "capability install took $($sw.Elapsed.TotalMinutes) min"
          # source first (shows the traceback in the log), then the frozen exe with a hard timeout:
          # a crash in the windowed exe opens an error dialog that would otherwise block forever
          python -c "from waraq.core import ocr; e=ocr.get_engine('windows'); print(ocr.ocr_pdf('tests/_fixtures/arabic_scanned.pdf', engine=e, langs='ara', pages='1')[0][:300])"
          $p = Start-Process -FilePath dist\WaraqPDF.exe -ArgumentList "ocr", "tests\_fixtures\arabic_scanned.pdf", "--engine", "windows", "--lang", "ara", "-o", "ocr_win.txt" -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; throw "exe OCR timed out (probably an error dialog)" }
          $t = Get-Content ocr_win.txt -Raw -Encoding utf8
          $t.Substring(0, [Math]::Min(400, $t.Length))
          if ($t -notmatch "برنامج") { throw "Arabic OCR text not as expected" }

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WaraqPDF.exe
